name: Automatic Build

# The name above and this file's path are referenced by README.md's nightly.link
# URL and status badge. Renaming either breaks those links.

on:
  # Push builds cover master only. Without the branch filter, pushing a branch
  # that already has a pull request open runs this workflow twice: once for the
  # push and once for the pull_request.
  push:
    branches: [master]
  pull_request:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

jobs:
  build:
    # Antares.vcxproj targets the v142 toolset, which ships with the windows-2022
    # image but is not guaranteed on windows-latest. If this image is retired,
    # either install v142 explicitly here or retarget the project.
    runs-on: windows-2022

    strategy:
      # Report both configurations rather than cancelling the second when the
      # first fails: a break in one often is not a break in the other.
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
    - uses: actions/checkout@v7
      with:
        # YRpp is a submodule and the build does not work without it.
        submodules: recursive

    - name: Build Antares
      uses: ./.github/actions/build-antares  # Build steps are reused
      with:
        sln-path: ${{env.SOLUTION_FILE_PATH}}
        build-config: ${{matrix.config}}
